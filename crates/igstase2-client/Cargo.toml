[package]
name = "igstase2-client"
version = "0.1.0"
description = "Command-line TASE.2 client: associates with a TASE.2 server and reads, writes, and monitors its points and data sets (task T2)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "igstase2-client"
path = "src/main.rs"

[dependencies]
igs-iec-tase2 = { path = "../igs-iec-tase2" }
igs-iec-tase2-link = { path = "../igs-iec-tase2-link" }
igs-iec-tase2-model = { path = "../igs-iec-tase2-model" }
igs-iso9506-mms.workspace = true
igs-iso9506-mms-codec.workspace = true
igs-iso9506-mms-link.workspace = true
# clap: the command line, derive only (MIT or Apache-2.0).
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# tokio: the runtime and the timers (MIT).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }

[dev-dependencies]
igs-iec-tase2-link = { path = "../igs-iec-tase2-link" }
