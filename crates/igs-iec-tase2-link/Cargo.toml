[package]
name = "igs-iec-tase2-link"
version = "1.0.0"
description = "TASE.2 (IEC 60870-6) sans-I/O bilateral tables, data sets and transfer sets."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The model of the TASE.2 types (tasks M1 to M6). A path dependency until it is published (rule 9).
igs-iec-tase2-model.workspace = true
# The MMS values of the data (`Data`) and the type descriptions, for the data values (task B3).
igs-iso9506-mms-codec.workspace = true

[lints]
workspace = true

[dev-dependencies]
# Property tests of the information messages (task C3).
proptest = { version = "1", default-features = false, features = ["std"] }
