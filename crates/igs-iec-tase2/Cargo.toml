[package]
name = "igs-iec-tase2"
version = "0.1.0"
description = "TASE.2 (IEC 60870-6) client on igs-iso9506-mms: association, data values, data sets, transfer sets and reports."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
igs-iec-tase2-model = { path = "../igs-iec-tase2-model" }
igs-iec-tase2-link = { path = "../igs-iec-tase2-link" }
igs-iso9506-mms.workspace = true
# The MMS types of the requests and the responses (task T1).
igs-iso9506-mms-codec.workspace = true
igs-iso9506-mms-link.workspace = true
# The update channel of the server, to its model (task S1).
tokio = { version = "1", features = ["sync"] }

[dev-dependencies]
# The runtime of the integration tests, which run the client against an in-process server (task T1).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
