[package]
name = "igstase2-server"
version = "1.0.0"
description = "Demonstration TASE.2 server: points from a TOML file, simulated changes, the device under test of the bench (task S2)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "igstase2-server"
path = "src/main.rs"

[dependencies]
igs-iec-tase2 = { path = "../igs-iec-tase2", version = "1.0.0" }
igs-iec-tase2-link = { path = "../igs-iec-tase2-link", version = "1.0.0" }
igs-iec-tase2-model = { path = "../igs-iec-tase2-model", version = "1.0.0" }
igs-iso9506-mms.workspace = true
igs-iso9506-mms-codec.workspace = true
igs-iso9506-mms-link.workspace = true
# clap: the command line, derive only (MIT or Apache-2.0).
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# serde and toml: the configuration file (MIT or Apache-2.0).
serde = { version = "1", features = ["derive"] }
toml = "1"
# tokio: the runtime, the timers and the Ctrl-C signal (MIT).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal", "sync"] }

[dev-dependencies]
igs-iec-tase2-link = { path = "../igs-iec-tase2-link", version = "1.0.0" }
