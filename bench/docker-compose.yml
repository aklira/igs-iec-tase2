# The interop bench of igs-iec-tase2 (task F4). The reference peer (rusty-iccp, as a black box) runs in its own
# container; the device under test is igsmms-server of igs-iso9506-mms (bench/device/build.sh). The capture shares the
# network namespace of the device, so that every frame of the association is seen once.

x-debian: &debian
  image: docker.io/library/debian:bookworm-slim

services:
  peer:
    build:
      context: ./peer
    command: ["sleep", "infinity"]
    networks:
      bench:
        ipv4_address: 172.31.110.21

  device:
    <<: *debian
    command: ["/usr/local/bin/igsmms-server", "--listen", "0.0.0.0:102", "--config", "/etc/igsmms/demo.toml"]
    volumes:
      - ./device/bin/igsmms-server:/usr/local/bin/igsmms-server:ro
      - ./device/demo.toml:/etc/igsmms/demo.toml:ro
    ports:
      - "127.0.0.1:10102:102"
    networks:
      bench:
        ipv4_address: 172.31.110.10

  # The TASE.2 device under test (task S2): igstase2-server, built by device/build-tase2.sh.
  device-tase2:
    <<: *debian
    command: ["/usr/local/bin/igstase2-server", "--listen", "0.0.0.0:102", "--config", "/etc/igstase2/tase2-demo.toml"]
    volumes:
      - ./device/bin/igstase2-server:/usr/local/bin/igstase2-server:ro
      - ./device/tase2-demo.toml:/etc/igstase2/tase2-demo.toml:ro
    ports:
      - "127.0.0.1:10103:102"
    networks:
      bench:
        ipv4_address: 172.31.110.11

  # The TASE.2 device of the load run (task S3): the same server with 10 000 points, generated by device/gen_load_config.py.
  device-load:
    <<: *debian
    command: ["/usr/local/bin/igstase2-server", "--listen", "0.0.0.0:102", "--config", "/etc/igstase2/load-10k.toml"]
    volumes:
      - ./device/bin/igstase2-server:/usr/local/bin/igstase2-server:ro
      - ./device/load-10k.toml:/etc/igstase2/load-10k.toml:ro
    ports:
      - "127.0.0.1:10104:102"
    networks:
      bench:
        ipv4_address: 172.31.110.12

  # The third-party peer of the interop bench (task I1): a TASE.2 server built from the peer's public API, outside this repository;
  # its binary is in bench/third-party-peer/bin (git ignores it). See bench/third-party-peer/build.sh.
  peer-third-party:
    <<: *debian
    command: ["/opt/peer/peer_server"]
    volumes:
      - ./third-party-peer/bin:/opt/peer:ro
    ports:
      - "127.0.0.1:10105:102"
    networks:
      bench:
        ipv4_address: 172.31.110.13

  # The example server of the third-party peer (task I1), for the interop of the client; the same build as peer-third-party.
  peer-example:
    <<: *debian
    command: ["/opt/peer/example-server"]
    volumes:
      - ./third-party-peer/bin:/opt/peer:ro
    ports:
      - "127.0.0.1:10106:102"
    networks:
      bench:
        ipv4_address: 172.31.110.14

  # Our server, for the example client of the third-party peer (task I1): the configuration is in the git-ignored directory.
  device-interop:
    <<: *debian
    command: ["/usr/local/bin/igstase2-server", "--listen", "0.0.0.0:102", "--config", "/etc/igstase2/interop-server.toml"]
    volumes:
      - ./device/bin/igstase2-server:/usr/local/bin/igstase2-server:ro
      - ./third-party-peer/bin/interop-server.toml:/etc/igstase2/interop-server.toml:ro
    ports:
      - "127.0.0.1:10107:102"
    networks:
      bench:
        ipv4_address: 172.31.110.15

  # The example client of the third-party peer (task I1), for the reverse interop: it runs commands on demand.
  peer-client-example:
    <<: *debian
    command: ["sleep", "infinity"]
    volumes:
      - ./third-party-peer/bin:/opt/peer:ro
    networks:
      bench:
        ipv4_address: 172.31.110.16

  # The TASE.2 client under test (task T3): igstase2-client, built by device/build-tase2.sh. It runs the matrix's commands.
  # It also runs the load driver igstase2-load (task S3).
  client-tase2:
    <<: *debian
    command: ["sleep", "infinity"]
    volumes:
      - ./client/bin/igstase2-client:/usr/local/bin/igstase2-client:ro
      - ./client/bin/igstase2-load:/usr/local/bin/igstase2-load:ro
    networks:
      bench:
        ipv4_address: 172.31.110.22

  capture:
    image: docker.io/nicolaka/netshoot@sha256:a20c2531bf35436ed3766cd6cfe89d352b050ccc4d7005ce6400adf97503da1b
    network_mode: "service:device"
    depends_on:
      - device
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      BENCH_CAPTURE: ${BENCH_CAPTURE:-bench.pcap}
    command:
      - sh
      - -c
      - tcpdump -i any -U --immediate-mode -Z root -w "/captures/$$BENCH_CAPTURE" tcp port 102 & exec sleep infinity
    volumes:
      - ./captures:/captures

networks:
  bench:
    ipam:
      config:
        - subnet: 172.31.110.0/24
